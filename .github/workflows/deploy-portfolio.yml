# ينشر موقع البورتفوليو على GitHub Pages تلقائيًا
# الموقع موجود في مجلد portfolio-site/ على فرع portfolio
name: Deploy Portfolio

on:
  push:
    branches: [portfolio]
    paths: ['portfolio-site/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio-site
      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
