<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — الصفحة غير موجودة | عبدالله ماهر</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=IBM+Plex+Sans+Arabic:wght@300;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--black:#0A0A0A;--white:#FAFAF8;--accent:#D93A2B;--font-display:'Amiri',serif;--font-body:'IBM Plex Sans Arabic',sans-serif}
    body{background:var(--white);color:var(--black);font-family:var(--font-body);min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}
    .num{font-family:var(--font-display);font-size:clamp(6rem,18vw,14rem);font-weight:700;line-height:1;letter-spacing:-0.04em;color:var(--accent)}
    .msg{font-size:clamp(1.1rem,2.5vw,1.5rem);font-weight:300;margin-top:1rem;max-width:28ch}
    .home{display:inline-block;margin-top:2.5rem;font-weight:500;font-size:0.95rem;color:var(--accent);text-decoration:none;border-bottom:2px solid var(--accent);padding-bottom:2px;transition:opacity .2s}
    .home:hover{opacity:.7}
  </style>
</head>
<body>
  <div class="num">404</div>
  <p class="msg">الصفحة التي تبحث عنها غير موجودة.</p>
  <a href="./" class="home">العودة للرئيسية ←</a>
</body>
</html>
